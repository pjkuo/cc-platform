<!-- ===== 注入：不插電五站實習・120 秒演練影片（YouTube T2teUYwV54g＋站內低解析小檔；只增不改／冪等）===== -->
<style id="cc-labvid-style">
.ccv-wrap{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;color:#15151F}
.ccv-mini{margin:10px 0 8px;border:1.5px solid #C7CBE4;border-radius:10px;overflow:hidden;background:#0F1330}
.ccv-mini video,.ccv-player video{display:block;width:100%;aspect-ratio:16/9;background:#0F1330}
.ccv-mini .ccv-cap{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;justify-content:space-between;padding:6px 9px;background:#EEF0FB;font-size:12px;font-weight:700;color:#2A2A8A}
.ccv-mini .ccv-cap a{color:#C81E1E;text-decoration:none;font-weight:800}
.ccv-panel{max-width:600px;margin:-6px 0 26px;border:2px solid #A9AED2;border-radius:14px;background:#fff;overflow:hidden;box-shadow:0 3px 14px rgba(20,30,80,.10)}
.ccv-panel .ccv-hd{padding:12px 16px 10px;background:#E4E6F7;border-bottom:1.5px solid #A9AED2}
.ccv-panel .ccv-t{font-size:16px;font-weight:900;color:#2A2A8A;line-height:1.4}
.ccv-panel .ccv-s{font-size:13px;font-weight:600;color:#3F3F57;margin-top:2px}
.ccv-tabs{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.ccv-tab{font:800 12.5px "Noto Sans TC","Microsoft JhengHei",sans-serif;padding:6px 12px;border-radius:99px;border:1.5px solid #2A2A8A;background:#fff;color:#2A2A8A;cursor:pointer}
.ccv-tab.on{background:#2A2A8A;color:#fff}
.ccv-player{position:relative;background:#0F1330}
.ccv-player iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
.ccv-yt-cover{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;padding:0;cursor:pointer;background:#0F1330 center/cover no-repeat}
.ccv-yt-cover span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#C81E1E;color:#fff;font:900 15px "Noto Sans TC",sans-serif;padding:10px 18px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.ccv-ft{display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 14px;font-size:12.5px;color:#3F3F57;font-weight:600}
.ccv-ft a{color:#2A2A8A;font-weight:800}
.ccv-steps{margin:0;padding:8px 14px 12px 32px;font-size:13px;color:#15151F;line-height:1.65;border-top:1px dashed #C7CBE4}
.ccv-steps b{color:#C81E1E}
@media(max-width:640px){.ccv-panel{margin:-6px 0 20px}.ccv-panel .ccv-t{font-size:15px}}
</style>
<script id="cc-labvid-script">
(function(){
  "use strict";
  if (window.__ccLabVidInjected) return;      // 冪等防護
  window.__ccLabVidInjected = true;
  var YT_ID = "T2teUYwV54g";
  var YT_URL = "https://youtu.be/" + YT_ID;
  var SRC = ["assets/video/unplugged-packet-120s.mp4",
             "https://pjkuo.github.io/cc-platform/assets/video/unplugged-packet-120s.mp4"];
  var POSTER = "assets/video/unplugged-packet-120s.jpg";
  var TITLE = "人體網路：二進位封包快遞（120 秒演練說明）";

  function el(t,c,h){ var e=document.createElement(t); if(c) e.className=c; if(h!=null) e.innerHTML=h; return e; }
  function mkVideo(){
    var v=document.createElement("video");
    v.controls=true; v.preload="none"; v.playsInline=true; v.poster=POSTER;
    v.setAttribute("playsinline",""); v.setAttribute("controlslist","nodownload");
    v.setAttribute("aria-label",TITLE);
    SRC.forEach(function(s){ var so=document.createElement("source"); so.src=s; so.type="video/mp4"; v.appendChild(so); });
    return v;
  }
  function stopAll(){
    document.querySelectorAll(".ccv-wrap video").forEach(function(v){ try{ v.pause(); }catch(e){} });
    document.querySelectorAll(".ccv-player iframe").forEach(function(f){ var p=f.parentNode; if(p && p.__ccvCover) p.__ccvCover(); });
  }

  /* ① 動手實習中心：「軟體實習・不插電五站實習」卡內嵌小畫面 */
  function placeMini(){
    var card=document.querySelector("#lhub-root .lh-card.sw");
    if(!card) return false;
    if(card.querySelector(".ccv-mini")) return true;
    var box=el("div","ccv-wrap ccv-mini");
    var v=mkVideo(); box.appendChild(v);
    box.appendChild(el("div","ccv-cap",'<span>🎬 120 秒演練說明・低解析小檔</span><a href="'+YT_URL+'" target="_blank" rel="noopener">YouTube 清晰版 ↗</a>'));
    box.addEventListener("click",function(ev){ ev.stopPropagation(); });
    var meta=card.querySelector(".lh-meta");
    card.insertBefore(box, meta || card.querySelector(".lh-go"));
    return true;
  }

  /* ② 不插電五站實習頁：標題下方影片面板（站內小檔 ⇄ YouTube） */
  function placePanel(){
    var root=document.getElementById("hpv-lab-root");
    if(!root) return false;
    if(root.querySelector(".ccv-panel")) return true;
    var firstSt=root.querySelector(".hpv-lab-station");
    if(!firstSt) return false;
    var pn=el("div","ccv-wrap ccv-panel");
    var hd=el("div","ccv-hd");
    hd.appendChild(el("div","ccv-t","🎬 先看 120 秒：" + TITLE));
    hd.appendChild(el("div","ccv-s","3–5 人一組當網路節點，用手勢傳 0/1、點頭確認、搖頭重傳——對應 ① 二進位、④ 可靠傳輸兩站。"));
    var tabs=el("div","ccv-tabs");
    var tA=el("button","ccv-tab on","📱 站內小檔（省流量）");
    var tB=el("button","ccv-tab","▶ YouTube（清晰版）");
    tA.type=tB.type="button";
    tabs.appendChild(tA); tabs.appendChild(tB); hd.appendChild(tabs);
    pn.appendChild(hd);
    var player=el("div","ccv-player"); pn.appendChild(player);
    var vid=mkVideo();
    function showLocal(){ tA.classList.add("on"); tB.classList.remove("on"); player.innerHTML=""; player.appendChild(vid); }
    function ytCover(){
      player.innerHTML="";
      var cv=el("button","ccv-yt-cover",'<span>▶ 播放 YouTube 清晰版</span>');
      cv.type="button"; cv.style.backgroundImage="url(https://i.ytimg.com/vi/"+YT_ID+"/hqdefault.jpg), url("+POSTER+")";
      cv.setAttribute("aria-label","播放 YouTube："+TITLE);
      cv.addEventListener("click",function(){
        player.innerHTML="";
        var f=document.createElement("iframe");
        f.src="https://www.youtube-nocookie.com/embed/"+YT_ID+"?autoplay=1&rel=0&modestbranding=1&playsinline=1";
        f.title=TITLE; f.loading="lazy";
        f.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
        f.allowFullscreen=true; player.appendChild(f);
      });
      player.appendChild(cv);
    }
    player.__ccvCover=ytCover;
    function showYT(){ try{ vid.pause(); }catch(e){} tB.classList.add("on"); tA.classList.remove("on"); ytCover(); }
    tA.addEventListener("click",showLocal); tB.addEventListener("click",showYT);
    vid.addEventListener("error",function(){},true);
    var lastSrc=vid.querySelectorAll("source"); lastSrc=lastSrc[lastSrc.length-1];
    lastSrc.addEventListener("error",function(){ showYT(); tA.disabled=true; tA.title="站內小檔暫不可用，已改用 YouTube"; tA.style.opacity=".45"; });
    showLocal();
    pn.appendChild(el("div","ccv-ft",'<span>約 2 分鐘・小檔約 420 KB（384×216）</span><a href="'+YT_URL+'" target="_blank" rel="noopener">在 YouTube 開啟 ↗</a>'));
    pn.appendChild(el("ol","ccv-steps","<li>看完影片，<b>先猜</b>：題目卡 13 要用幾個位元、怎麼用手勢傳？</li><li>分組上場演練，再到下方 <b>第 1 站</b> 用數字卡<b>驗證</b>你的二進位。</li><li>回想「點頭／搖頭」，到 <b>第 4 站</b> 驗證「確認與重送」為什麼必要。</li>"));
    root.insertBefore(pn, firstSt);
    return true;
  }

  /* 切換頁面時暫停影片 */
  (function(){
    if (typeof window.__show!=="function") return;
    var _s=window.__show;
    window.__show=function(k){ stopAll(); return _s.apply(this, arguments); };
  })();

  var tries=0;
  function tick(){ var a=placeMini(), b=placePanel(); if(a&&b) return; if(++tries<20) setTimeout(tick,250); }
  tick();
  if(document.readyState!=="complete") window.addEventListener("load",function(){ tries=0; tick(); });
})();
</script>
