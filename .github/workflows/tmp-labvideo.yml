name: tmp-labvideo
on:
  push:
    branches: [tmp-labvideo-src]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: transcode + patch + gate
        run: |
          set -e
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg >/dev/null
          git fetch -q origin tmp-labvideo-src
          SRC=$(git ls-tree -r --name-only origin/tmp-labvideo-src | grep -i '\.mp4$' | grep -v '^assets/' | head -1)
          echo "src: $SRC"
          git show "origin/tmp-labvideo-src:$SRC" > /tmp/src.mp4
          ls -la /tmp/src.mp4
          mkdir -p assets/video
          ffmpeg -v error -y -i /tmp/src.mp4 -vf "scale=384:216:flags=lanczos,fps=12" -c:v libx264 -preset veryslow -tune stillimage -crf 34 -profile:v main -pix_fmt yuv420p -c:a aac -b:a 16k -ac 1 -ar 16000 -movflags +faststart assets/video/unplugged-packet-120s.mp4
          ffmpeg -v error -y -ss 2.5 -i assets/video/unplugged-packet-120s.mp4 -frames:v 1 -q:v 8 assets/video/unplugged-packet-120s.jpg
          ls -la assets/video
          SZ=$(stat -c%s assets/video/unplugged-packet-120s.mp4); test "$SZ" -lt 800000
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 assets/video/unplugged-packet-120s.mp4); echo "dur $D"
          python3 -c "import sys; d=float('$D'); sys.exit(0 if 115<d<130 else 1)"
          test "$(md5sum _patch/lab-video.html | cut -d' ' -f1)" = "7077db1df5cbcea1e836360fa5eaee1d"
          test "$(md5sum index.html | cut -d' ' -f1)" = "5d05c83dec13bfc44a865cde4882cd86"
          python3 - <<'PY'
          s=open('index.html','rb').read(); b=open('_patch/lab-video.html','rb').read()
          assert b'cc-labvid-script' not in s
          i=s.rfind(b'</body>'); open('index.html','wb').write(s[:i]+b+s[i:])
          PY
          N=$(md5sum index.html | cut -d' ' -f1); echo "index $N"
          test "$N" = "20cf9684ee67bf6e686f8fad947b2d54"
          git rm -rq _patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/video/unplugged-packet-120s.mp4 assets/video/unplugged-packet-120s.jpg index.html
          git commit -m "不插電五站實習：嵌入 120 秒演練影片（YouTube T2teUYwV54g＋站內低解析小檔 384x216） [skip ci]"
          git push origin HEAD:main
          git push origin --delete tmp-labvideo-src
